<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/logo/Logo.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Utility & Component Scripts -->
    <script src="../js/util.js" defer></script>
    <script src="../js/render.js" defer></script>
    <script src="../js/components/header.js" defer></script>
    <script src="../js/components/footer.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <!-- Header Placeholder -->
            <div id="header"></div>

            <!-- Main Content -->
            <main class="main-content">
                <h2>Select Your Role</h2>
                <div class="role-selection">
                    <button id="adminBtn" class="btn role-btn" onclick="selectRole('admin')">Admin</button>
                    <button id="doctorBtn" class="btn role-btn" onclick="selectRole('doctor')">Doctor</button>
                    <button id="patientBtn" class="btn role-btn" onclick="selectRole('patient')">Patient</button>
                </div>
            </main>

            <!-- Footer Placeholder -->
            <div id="footer"></div>
        </div>
    </div>

    <!-- Hidden Modal Overlay -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Page Specific Logic Module -->
    <script type="module" src="../js/services/index.js" defer></script>
</body>
</html>
