<!-- adminDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">

  <!-- Utility and Rendering JavaScript Files -->
  <script th:src="@{/js/render.js}" defer></script>
  <script th:src="@{/js/util.js}" defer></script>

  <!-- Layout Component Scripts -->
  <script th:src="@{/js/components/header.js}" defer></script>
  <script th:src="@{/js/components/footer.js}" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <!-- Dynamic Header Placeholder -->
      <div id="header"></div>

      <!-- Main Section -->
      <main class="main-content">
        <!-- Search and Filter Controls -->
        <section class="controls-section">
          <input 
            type="text" 
            id="searchBar" 
            placeholder="search by doctor name" 
          />

          <div class="filter-group">
            <select id="timeFilter" class="select-dropdown">
              <option value="">Sort by Time</option>
              <option value="AM">Morning (AM)</option>
              <option value="PM">Afternoon / Evening (PM)</option>
            </select>

            <select id="specialtyFilter" class="select-dropdown">
              <option value="">Filter by Specialty</option>
              <option value="Cardiologist">Cardiologist</option>
              <option value="Dentist">Dentist</option>
              <option value="Dermatologist">Dermatologist</option>
              <option value="Neurologist">Neurologist</option>
              <option value="Pediatrician">Pediatrician</option>
              <option value="General Physician">General Physician</option>
            </select>
          </div>
        </section>

        <!-- Dynamic Content Display Area -->
        <div id="content"></div>
      </main>

      <!-- Dynamic Footer Placeholder -->
      <div id="footer"></div>
    </div>
  </div>

  <!-- Modal for Adding Doctor -->
  <div id="modal" class="modal">
    <span id="closeModal" class="close">&times;</span>
    <div id="modal-body"></div>
  </div>

  <!-- Page-Specific JavaScript Modules -->
  <script type="module" src="../js/services/adminDashboard.js" defer></script>
  <script type="module" src="../js/components/doctorCard.js" defer></script>
</body>
</html>
