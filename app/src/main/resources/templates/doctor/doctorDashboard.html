<!-- doctorDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">

  <!-- Utility and Rendering JavaScript Files -->
  <script th:src="@{/js/render.js}" defer></script>
  <script th:src="@{/js/util.js}" defer></script>

  <!-- Component Scripts -->
  <script th:src="@{/js/components/header.js}" defer></script>
  <script th:src="@{/js/components/footer.js}" defer></script>
  <script th:src="@{/js/components/patientRows.js}" defer></script>

  <!-- Services and Main Logic -->
  <script type="module" th:src="@{/js/services/patientServices.js}" defer></script>
  <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <!-- Dynamic Header Placeholder -->
      <div id="header"></div>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- Search and Filter Controls -->
        <section class="controls-section">
          <input 
            type="text" 
            id="searchBar" 
            class="searchBar" 
            placeholder="Search Bar for custom output" 
          />

          <div class="filter-controls">
            <button id="todayButton" class="btn filter-btn" type="button">Today's Appointments</button>
            <input type="date" id="datePicker" class="date-picker" />
          </div>
        </section>

        <!-- Patient Records Table -->
        <section class="table-section">
          <table id="patientTable" class="patient-table">
            <thead>
              <tr>
                <th>Patient ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Prescription</th>
              </tr>
            </thead>
            <tbody id="patientTableBody">
              <!-- Dynamically populated via patientRows.js / doctorDashboard.js -->
            </tbody>
          </table>
        </section>
      </div>

      <!-- Dynamic Footer Placeholder -->
      <div id="footer"></div>
    </div>
  </div>
</body>
</html>
